<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flock — choose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=optional">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=optional">
<link rel="stylesheet" href="/styles.css">
<style>
.chooser-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.chooser {
  max-width: 420px;
  width: 100%;
  text-align: center;
}
.chooser-logo {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 56px;
  color: var(--text);
  margin-bottom: 8px;
}
.chooser-logo .accent { color: var(--accent); }
.chooser-greeting {
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 36px;
}
.chooser-btn {
  display: block;
  width: 100%;
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  padding: 18px 24px;
  border-radius: 14px;
  cursor: pointer;
  margin-bottom: 12px;
  text-decoration: none;
  text-align: center;
}
.chooser-btn.secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.chooser-btn:hover { opacity: 0.9; color: var(--accent-text); }
.chooser-btn.secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
}
</style>
<script>
  (function() {
    try {
      const v = JSON.parse(localStorage.getItem('flock_venue') || 'null');
      const t = (v && v.theme) ? v.theme : 'dark-premium';
      document.addEventListener('DOMContentLoaded', function() {
        // Swap only the theme-* class — preserve landing-light (the light-mode overlay) and
        // any other body classes, instead of clobbering className wholesale.
        [...document.body.classList].filter(c => c.startsWith('theme-')).forEach(c => document.body.classList.remove(c));
        document.body.classList.add('theme-' + t);
      });
    } catch(e) {}
  })();
</script>
<script>
  (function() {
    try {
      const saved = localStorage.getItem('flock_landing_theme');
      if (saved === 'light') document.documentElement.classList.add('landing-light-pre');
    } catch(e) {}
  })();
</script>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x35i62ofe4");
</script>
</head>
<body class="theme-dark-premium">
<script>
  if (document.documentElement.classList.contains('landing-light-pre')) {
    document.body.classList.add('landing-light');
    document.documentElement.classList.remove('landing-light-pre');
  }
</script>
<button class="theme-toggle theme-toggle-fixed" onclick="toggleAppTheme()" aria-label="Toggle theme" id="themeToggle">☀</button>
<div class="chooser-wrap">
  <div class="chooser">
    <h1 class="chooser-logo">fl<span class="accent">o</span>ck</h1>
    <p class="chooser-greeting">Where would you like to go?</p>
    <a href="/dashboard.html" class="chooser-btn">Go to live queue</a>
    <a href="/main.html" class="chooser-btn secondary">Go to main</a>
  </div>
</div>

<script>
// Intercept 401s globally — redirect to login
const _origFetch = window.fetch;
window.fetch = async function(...args) {
  const res = await _origFetch.apply(this, args);
  if (args[0] && typeof args[0] === 'string' && args[0].includes('/api/')) {
   if (res.status === 401) {
      localStorage.clear();
      sessionStorage.setItem('flock_expired', '1');
      window.location.replace('/login.html');
      return new Promise(() => {}); // halt callers — page is navigating away
    } else if (res.status === 402) {
      sessionStorage.setItem('flock_sub_expired', '1');
      window.location.replace('/subscribe.html');
      return new Promise(() => {});
    }
  }
  return res;
};

const token = localStorage.getItem('flock_token');
if (!token) {
  window.location.href = '/login.html';
} else {
  // Chooser is deprecated — send straight to dashboard
  window.location.replace('/dashboard.html');
}

function toggleAppTheme() {
  document.body.classList.toggle('landing-light');
  const isLight = document.body.classList.contains('landing-light');
  localStorage.setItem('flock_landing_theme', isLight ? 'light' : 'dark');
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = isLight ? '☾' : '☀';
}
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = document.body.classList.contains('landing-light') ? '☾' : '☀';
});

</script>
</body>
</html>
