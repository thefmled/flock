<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flock — choose</title>
<link rel="stylesheet" href="/styles.css">
<style>
.chooser-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.chooser {
  max-width: 420px;
  width: 100%;
  text-align: center;
}
.chooser-logo {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 56px;
  color: var(--text);
  margin-bottom: 8px;
}
.chooser-logo .accent { color: var(--accent); }
.chooser-greeting {
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 36px;
}
.chooser-btn {
  display: block;
  width: 100%;
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  padding: 18px 24px;
  border-radius: 14px;
  cursor: pointer;
  margin-bottom: 12px;
  text-decoration: none;
  text-align: center;
}
.chooser-btn.secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.chooser-btn:hover { opacity: 0.9; color: var(--accent-text); }
.chooser-btn.secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
}
</style>
</head>
<body class="theme-dark-premium">
<div class="chooser-wrap">
  <div class="chooser">
    <h1 class="chooser-logo">fl<span class="accent">o</span>ck</h1>
    <p class="chooser-greeting">Where would you like to go?</p>
    <a href="/dashboard.html" class="chooser-btn" onclick="rememberChoice('dashboard')">Go to live queue</a>
    <a href="/main.html" class="chooser-btn secondary" onclick="rememberChoice('main')">Go to main</a>
  </div>
</div>

<script>
const token = localStorage.getItem('flock_token');
if (!token) window.location.href = '/login.html';

function rememberChoice(dest) {
  localStorage.setItem('flock_last_destination', dest);
}

// If they've made this choice before, auto-redirect
const lastChoice = localStorage.getItem('flock_last_destination');
if (lastChoice === 'dashboard') window.location.replace('/dashboard.html');
else if (lastChoice === 'main') window.location.replace('/main.html');
</script>
</body>
</html>
