<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flock · choose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=optional">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=optional">
<link rel="stylesheet" href="/styles.css">
<style>
.chooser-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.chooser {
  max-width: 420px;
  width: 100%;
  text-align: center;
}
.chooser-logo {
  font-family: 'Inter', sans-serif;
  letter-spacing: -0.025em;
  font-size: 56px;
  color: var(--text);
  margin-bottom: 8px;
}
.chooser-logo .accent { color: var(--accent); }
.chooser-greeting {
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 36px;
}
.chooser-btn {
  display: block;
  width: 100%;
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  padding: 18px 24px;
  border-radius: 14px;
  cursor: pointer;
  margin-bottom: 12px;
  text-decoration: none;
  text-align: center;
}
.chooser-btn.secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.chooser-btn:hover { opacity: 0.9; color: var(--accent-text); }
.chooser-btn.secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
}
</style>
<script>
</script>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x35i62ofe4");
</script>
<script>(function(){try{var t=localStorage.getItem("flock_theme");if(t==="dark"||t==="light"||t==="system"){document.documentElement.setAttribute("data-theme",t)}else{document.documentElement.setAttribute("data-theme","system")}}catch(e){}})();</script>
</head>
<body>
<div data-theme-switch="fixed"></div>
<div class="chooser-wrap">
  <div class="chooser">
    <h1 class="chooser-logo">fl<span class="accent">o</span>ck</h1>
    <p class="chooser-greeting">Where would you like to go?</p>
    <a href="/dashboard.html" class="chooser-btn">Go to live queue</a>
    <a href="/main.html" class="chooser-btn secondary">Go to main</a>
  </div>
</div>

<script>
// Intercept 401s globally, redirect to login
const _origFetch = window.fetch;
window.fetch = async function(...args) {
  const res = await _origFetch.apply(this, args);
  if (args[0] && typeof args[0] === 'string' && args[0].includes('/api/')) {
   if (res.status === 401) {
      localStorage.clear();
      sessionStorage.setItem('flock_expired', '1');
      window.location.replace('/login.html');
      return new Promise(() => {}); // halt callers, page is navigating away
    } else if (res.status === 402) {
      sessionStorage.setItem('flock_sub_expired', '1');
      window.location.replace('/subscribe.html');
      return new Promise(() => {});
    }
  }
  return res;
};

const token = localStorage.getItem('flock_token');
if (!token) {
  window.location.href = '/login.html';
} else {
  // Chooser is deprecated, send straight to dashboard
  window.location.replace('/dashboard.html');
}

</script>
<script src="/theme.js"></script>
</body>
</html>
