<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in / Sign up — flock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=optional">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=optional">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="theme-dark-premium">
  <main class="container" style="max-width: 440px; padding-top: 80px;">
    <h1 class="logo" style="font-size: 48px; text-align: center; margin-bottom: 8px;">fl<span class="accent">o</span>ck</h1>

    <div class="card" id="emailStep">
      <h2 class="heading">Log in or sign up</h2>
      <p class="subheading">Enter your email to receive a one-time code.</p>
      <div id="expiredBanner" style="display:none;background:var(--accent-soft);color:var(--accent);padding:10px 12px;border-radius:8px;margin-bottom:16px;font-size:13px;">Your session expired. Please log in again.</div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@venue.com" autocomplete="email" />
      </div>
      <button class="button" onclick="requestOtp()">Send code</button>
      <p class="error" id="emailError"></p>
    </div>

    <div class="card" id="otpStep" style="display: none;">
      <h2 class="heading">Enter code</h2>
      <p class="subheading">We sent a 6-digit code to <span id="emailDisplay"></span>.</p>
      <div class="input-group">
        <label for="code">Code</label>
        <input type="text" id="code" maxlength="6" placeholder="123456" inputmode="numeric" autocomplete="one-time-code" oninput="if(this.value.length===6) verifyOtp();" />
      </div>
      <button class="button" onclick="verifyOtp()">Log in</button>
      <p class="error" id="otpError"></p>
      <p style="text-align: center; margin-top: 16px;">
        <a href="#" onclick="resendOtp(); return false;" style="color: var(--accent); font-size: 13px; margin-right: 16px;">Resend code</a>
        <a href="#" onclick="resetLogin(); return false;" style="color: var(--text-muted); font-size: 13px;">Use a different email</a>
      </p>
    </div>
  </main>

  <script>
    if (sessionStorage.getItem('flock_expired') === '1') {
      sessionStorage.removeItem('flock_expired');
      document.addEventListener('DOMContentLoaded', () => {
        const banner = document.getElementById('expiredBanner');
        if (banner) banner.style.display = 'block';
      });
    }
    const API = '';

    async function requestOtp() {
      const email = document.getElementById('email').value.trim();
      const errorEl = document.getElementById('emailError');
      const btn = document.querySelector('#emailStep .button');
      errorEl.textContent = '';

      if (!email || !email.includes('@')) {
        errorEl.textContent = 'Please enter a valid email.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const res = await fetch(API + '/api/auth/request-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to send code');

        document.getElementById('emailStep').style.display = 'none';
        document.getElementById('otpStep').style.display = 'block';
        document.getElementById('emailDisplay').textContent = email;
        sessionStorage.setItem('flock_email', email);
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send code';
      }
    }

    async function verifyOtp() {
      const code = document.getElementById('code').value.trim();
      const email = sessionStorage.getItem('flock_email');
      const errorEl = document.getElementById('otpError');
      const btn = document.querySelector('#otpStep .button');
      errorEl.textContent = '';
      if (!code || code.length !== 6) {
        errorEl.textContent = 'Enter the 6-digit code.';
        return;
      }
      
      btn.disabled = true;
      btn.textContent = 'Verifying…';
      
      try {
        const res = await fetch(API + '/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Invalid code');
        localStorage.setItem('flock_token', data.token);
        // Only store minimal owner info, not the full record (which has razorpay IDs etc.)
        localStorage.setItem('flock_owner', JSON.stringify({ id: data.owner.id, phone: data.owner.phone }));
        
        if (data.isNewUser) {
          window.location.replace('/subscribe.html');
          return;
        }
        
        btn.textContent = 'Loading…';
        
        // Parallel-fire both checks
        const [statusRes, venuesRes] = await Promise.all([
          fetch('/api/subscription/status', { headers: { 'Authorization': 'Bearer ' + data.token } }),
          fetch('/api/venues', { headers: { 'Authorization': 'Bearer ' + data.token } }),
        ]);
        const [statusData, venuesData] = await Promise.all([statusRes.json(), venuesRes.json()]);
        
        if (!statusData.hasSubscription || statusData.status === 'cancelled' || statusData.status === 'expired') {
          window.location.replace('/subscribe.html');
        } else if (!venuesData.venues || venuesData.venues.length === 0) {
          window.location.replace('/setup.html');
        } else {
          window.location.replace('/dashboard.html');
        }
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    }

    async function resendOtp() {
      const email = sessionStorage.getItem('flock_email');
      if (!email) return;
      const errorEl = document.getElementById('otpError');
      errorEl.textContent = '';
      try {
        const res = await fetch(API + '/api/auth/request-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to resend code');
        errorEl.style.color = 'var(--success)';
        errorEl.textContent = 'New code sent.';
        setTimeout(() => { errorEl.style.color = ''; errorEl.textContent = ''; }, 3000);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    function resetLogin() {
      document.getElementById('emailStep').style.display = 'block';
      document.getElementById('otpStep').style.display = 'none';
      document.getElementById('code').value = '';
      document.getElementById('otpError').textContent = '';
    }
    
  </script>
</body>
</html>
