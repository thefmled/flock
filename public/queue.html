<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the queue — flock</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="theme-dark-premium">
  <main class="container" style="max-width: 480px; padding-top: 48px;">
    <h1 class="logo" style="font-size: 48px; text-align: center; margin-bottom: 8px;">fl<span class="accent">o</span>ck</h1>
    <p style="text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:32px;" id="venueLabel"></p>

    <div class="card" id="joinStep">
      <h2 class="heading">Join the queue</h2>
      <p class="subheading">A few quick details and you're on the list.</p>

      <div class="input-group">
        <label for="guestName">Your name</label>
        <input type="text" id="guestName" placeholder="e.g. Aarav" />
      </div>

      <div class="input-group">
        <label for="guestPhone">Phone</label>
        <input type="tel" id="guestPhone" inputmode="numeric" placeholder="9876543210" />
      </div>

      <div class="input-group">
        <label for="partySize">Party size</label>
        <select id="partySize">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8+</option>
        </select>
      </div>

      <div class="input-group">
        <label>Seating preference (optional)</label>
        <div class="seating-chips" id="seatingChips"></div>
      </div>

      <div class="input-group">
        <label>Any other notes? (optional)</label>
        <div class="seating-chips" id="notesChips"></div>
      </div>

      <button class="button" onclick="joinQueue()">Join queue</button>
      <p class="error" id="joinError"></p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('venue');
    if (!slug) {
      document.body.innerHTML = '<div class="empty" style="padding-top:100px;">Invalid queue link.</div>';
    }

    let seatingState = [];
    let notesState = [
      { name: "I'm lactose intolerant", selected: false },
      { name: "Prefer Jain food", selected: false },
      { name: "Prefer non-spicy", selected: false },
      { name: "Allergic to nuts", selected: false },
      { name: "Birthday/anniversary", selected: false },
      { name: "Need a high chair", selected: false },
    ];

    async function loadVenue() {
      try {
        const res = await fetch('/api/venues/by-slug/' + slug);
        const data = await res.json();
        if (data.venue) {
          document.getElementById('venueLabel').textContent = data.venue.name;
          
          const opts = (data.venue.seatingOptions || 'Indoor,Outdoor,No preference').split(',');
          // Put "No preference" first and pre-select it
          const sorted = ['No preference', ...opts.map(o => o.trim()).filter(o => o !== 'No preference')];
          seatingState = sorted.map(o => ({ name: o, selected: o === 'No preference' }));
          renderSeatingChips();
          renderNotesChips();
        }
      } catch (e) {}
    }

    function renderSeatingChips() {
      const c = document.getElementById('seatingChips');
      c.innerHTML = seatingState.map((opt, i) => `
        <button type="button" class="chip ${opt.selected ? 'selected' : ''}" onclick="selectSeating(${i})">
          ${escapeHtml(opt.name)}
        </button>
      `).join('');
    }

    function selectSeating(i) {
      // Single-select for seating
      seatingState = seatingState.map((o, idx) => ({ ...o, selected: idx === i }));
      renderSeatingChips();
    }

    function renderNotesChips() {
      const c = document.getElementById('notesChips');
      c.innerHTML = notesState.map((opt, i) => `
        <button type="button" class="chip ${opt.selected ? 'selected' : ''}" onclick="toggleNote(${i})">
          ${escapeHtml(opt.name)}
        </button>
      `).join('') + '<button type="button" class="chip add-chip" onclick="addNote()">+ Add note</button>';
    }

    function toggleNote(i) {
      notesState[i].selected = !notesState[i].selected;
      renderNotesChips();
    }

    function addNote() {
      const name = prompt('Add a note:');
      if (name && name.trim()) {
        notesState.push({ name: name.trim(), selected: true });
        renderNotesChips();
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function joinQueue() {
      const errorEl = document.getElementById('joinError');
      const btn = document.querySelector('.button');
      errorEl.textContent = '';

      const phone = document.getElementById('guestPhone').value.replace(/\D/g, '');
      if (!/^[6-9]\d{9}$/.test(phone)) {
        errorEl.textContent = 'Enter a valid 10-digit Indian phone number.';
        return;
      }

      const selectedSeating = seatingState.find(o => o.selected);
      const selectedNotes = notesState.filter(o => o.selected).map(o => o.name);

      const payload = {
        guestName: document.getElementById('guestName').value.trim(),
        guestPhone: phone,
        partySize: document.getElementById('partySize').value,
        seatingPreference: (selectedSeating && selectedSeating.name !== 'No preference') ? selectedSeating.name : null,
        notes: selectedNotes.length ? selectedNotes.join(', ') : null,
      };

      if (!payload.guestName) {
        errorEl.textContent = 'Name is required.';
        return;
      }

      // Optimistic: disable button + show loading state instantly
      btn.disabled = true;
      btn.textContent = 'Joining…';

      try {
        const res = await fetch('/api/queue/join/' + slug, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to join queue');
        // Replace page so back-button doesn't return to the form
        window.location.replace('/status.html?id=' + data.entry.id);
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Join queue';
      }
    }

    loadVenue();
  </script>
</body>
</html>
