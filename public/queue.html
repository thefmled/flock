<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the queue — flock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css" />

  <style>body{opacity:0;}body.theme-loaded{opacity:1;transition:opacity 0.15s;}</style>
  <script>
    (function() {
      try {
        const venueSlug = new URLSearchParams(window.location.search).get('venue');
        const cached = venueSlug ? sessionStorage.getItem('flock_venue_theme_' + venueSlug) : null;
        document.addEventListener('DOMContentLoaded', function() {
          if (cached) {
            document.body.className = 'theme-' + cached + ' theme-loaded';
          }
        });
        setTimeout(function() {
          if (!document.body.classList.contains('theme-loaded')) {
            document.body.className = 'theme-dark-premium theme-loaded';
          }
        }, 4000);
      } catch(e) {}
    })();
  </script>
  
</head>
<body>
  <main class="container" style="max-width: 480px; padding-top: 48px;">
    <h1 class="logo" style="font-size: 48px; text-align: center; margin-bottom: 8px;">fl<span class="accent">o</span>ck</h1>
    <p style="text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:4px;" id="venueLabel"></p>
    <p style="text-align:center;color:var(--text-muted);font-size:12px;margin-bottom:32px;" id="venueAddress"></p>

    <form class="card" id="joinStep" onsubmit="event.preventDefault(); joinQueue();">
      <h2 class="heading">Join the queue</h2>
      <p class="subheading">A few quick details and you're on the list.</p>

      <div class="input-group">
        <label for="guestName">Your name</label>
        <input type="text" id="guestName" placeholder="e.g. Aarav" autocomplete="name" autofocus />
      </div>

      <div class="input-group">
        <label for="guestPhone">Phone</label>
        <input type="tel" id="guestPhone" inputmode="numeric" placeholder="9876543210" autocomplete="tel" />
      </div>

      <div class="input-group">
        <label for="partySize">Party size</label>
        <select id="partySize">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
        </select>
      </div>

      <div class="input-group">
        <label>Seating preference (optional)</label>
        <div class="seating-chips" id="seatingChips"></div>
      </div>

      <div class="input-group" id="notesGroup" style="display:none;">
        <label>Anything to note?</label>
        <div class="seating-chips" id="notesChips"></div>
      </div>

      <button type="submit" class="button">Join queue</button>
      <p class="error" id="joinError"></p>
    </form>
  </main>

  <div id="promptModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center;padding:20px;">
    <div style="background:var(--card);border-radius:16px;padding:28px;max-width:360px;width:100%;border:1px solid var(--border-strong);">
      <h3 class="heading" id="promptTitle" style="font-size:18px;margin-bottom:16px;"></h3>
      <input type="text" id="promptInput" style="width:100%;background:var(--card-hover);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-family:inherit;font-size:14px;margin-bottom:16px;box-sizing:border-box;" />
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="window._promptCancel()" style="background:transparent;color:var(--text);border:1px solid var(--border-strong);font-family:inherit;font-size:14px;padding:10px 20px;border-radius:8px;cursor:pointer;">Cancel</button>
        <button onclick="window._promptOk()" style="background:var(--accent);color:var(--accent-text);border:none;font-family:inherit;font-size:14px;font-weight:500;padding:10px 20px;border-radius:8px;cursor:pointer;">Add</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('venue');
    if (!slug) {
      document.body.className = 'theme-dark-premium theme-loaded';
      document.body.innerHTML = '<div class="empty" style="padding-top:100px;text-align:center;color:var(--text-muted);">Invalid queue link.</div>';
    }

    let seatingState = [];
    let notesState = [];

    function showVenueUnavailable() {
      document.body.className = 'theme-dark-premium theme-loaded';
      document.body.innerHTML = '<div class="empty" style="padding:100px 24px 0;text-align:center;color:var(--text-muted);"><p style="font-size:16px;">This queue link is invalid or the venue is unavailable.</p><p style="margin-top:8px;font-size:13px;">Please ask staff for a fresh QR code.</p></div>';
    }

    async function loadVenue() {
      try {
        const res = await fetch('/api/venues/by-slug/' + slug);
        if (!res.ok) throw new Error('unavailable');
        const data = await res.json();
        if (data.venue) {
          document.body.className = 'theme-' + (data.venue.theme || 'dark-premium') + ' theme-loaded';
          sessionStorage.setItem('flock_venue_theme_' + (params.get('venue') || ''), data.venue.theme || 'dark-premium');
          sessionStorage.setItem('flock_venue_data', JSON.stringify(data.venue));
          document.getElementById('venueLabel').textContent = data.venue.name;
          document.getElementById('venueAddress').textContent = data.venue.address || '';
          
          const opts = (data.venue.seatingOptions || 'Indoor,Outdoor,No preference').split(',');
          const activeOpts = opts.map(o => o.trim()).filter(o => !o.startsWith('_'));
          const sorted = ['No preference', ...activeOpts.filter(o => o !== 'No preference')];
          seatingState = sorted.map(o => ({ name: o, selected: o === 'No preference' }));
          renderSeatingChips();

          // Notes options
          const noteOpts = (data.venue.noteOptions || '').split(',').map(o => o.trim()).filter(o => o && !o.startsWith('_'));
          notesState = noteOpts.map(o => ({ name: o, selected: false }));
          document.getElementById('notesGroup').style.display = noteOpts.length > 0 ? 'block' : 'none';
          renderNotesChips();
        } else {
          showVenueUnavailable();
        }
      } catch (e) {
        showVenueUnavailable();
      }
    }

    function renderSeatingChips() {
      const c = document.getElementById('seatingChips');
      c.innerHTML = seatingState.map((opt, i) => `
        <button type="button" class="chip ${opt.selected ? 'selected' : ''}" onclick="selectSeating(${i})">
          ${escapeHtml(opt.name)}
        </button>
      `).join('');
    }

    function selectSeating(i) {
      // Single-select for seating
      seatingState = seatingState.map((o, idx) => ({ ...o, selected: idx === i }));
      renderSeatingChips();
    }

    function renderNotesChips() {
      const c = document.getElementById('notesChips');
      c.innerHTML = notesState.map((opt, i) => `
        <button type="button" class="chip ${opt.selected ? 'selected' : ''}" onclick="toggleNote(${i})">
          ${escapeHtml(opt.name)}
        </button>
      `).join('') + '<button type="button" class="chip add-chip" onclick="addNote()">+ Add note</button>';
    }

    function toggleNote(i) {
      notesState[i].selected = !notesState[i].selected;
      renderNotesChips();
    }

    function promptModal(title, placeholder) {
      return new Promise((resolve) => {
        const modal = document.getElementById('promptModal');
        document.getElementById('promptTitle').textContent = title;
        const input = document.getElementById('promptInput');
        input.value = '';
        input.placeholder = placeholder || '';
        modal.style.display = 'flex';
        setTimeout(() => input.focus(), 50);
        window._promptOk = () => { modal.style.display = 'none'; resolve(input.value.trim()); };
        window._promptCancel = () => { modal.style.display = 'none'; resolve(null); };
        input.onkeydown = (e) => { if (e.key === 'Enter') window._promptOk(); if (e.key === 'Escape') window._promptCancel(); };
      });
    }

    async function addNote() {
      const name = await promptModal('Add a note', 'e.g. Window seat preferred');
      if (name) {
        notesState.push({ name, selected: true });
        renderNotesChips();
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function joinQueue() {
      const errorEl = document.getElementById('joinError');
      const btn = document.querySelector('.button');
      errorEl.textContent = '';

      let phone = document.getElementById('guestPhone').value.replace(/\D/g, '');
      // Strip +91/91 prefix if present
      if (phone.length > 10) phone = phone.slice(-10);
      if (!/^[6-9]\d{9}$/.test(phone)) {
        errorEl.textContent = 'Enter a valid 10-digit Indian phone number.';
        return;
      }

      const selectedSeating = seatingState.find(o => o.selected);
      const selectedNotes = notesState.filter(o => o.selected).map(o => o.name);
      const allNotes = selectedNotes.join(', ');
      const payload = {
        guestName: document.getElementById('guestName').value.trim(),
        guestPhone: phone,
        partySize: document.getElementById('partySize').value,
        seatingPreference: (selectedSeating && selectedSeating.name !== 'No preference') ? selectedSeating.name : null,
        notes: allNotes || null,
      };
      if (!payload.guestName) {
        errorEl.textContent = 'Name is required.';
        return;
      }

      // Optimistic: disable button + show loading state instantly
      btn.disabled = true;
      btn.textContent = 'Joining…';

      try {
        const res = await fetch('/api/queue/join/' + slug, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to join queue');
        const venueData = JSON.parse(sessionStorage.getItem('flock_venue_data') || '{}');
        const queryObj = { id: data.entry.id };
        if (data.position != null) queryObj.position = data.position;
        if (data.waitMinutes != null) queryObj.wait = data.waitMinutes;
        queryObj.venueName = document.getElementById('venueLabel').textContent;
        if (venueData.menuPdfUrl) queryObj.menuPdfUrl = venueData.menuPdfUrl;
        if (venueData.googleReviewsUrl) queryObj.googleReviewsUrl = venueData.googleReviewsUrl;
        const params = new URLSearchParams(queryObj);
        window.location.replace('/status.html?' + params.toString());
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Join queue';
      }
    }

    loadVenue();
  </script>
</body>
</html>
