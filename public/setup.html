<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set up your venue · flock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=optional">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=optional">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .seating-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .chip {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chip.selected {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    .chip.add-chip {
      border-style: dashed;
    }
    .chip-remove {
      font-size: 14px;
      opacity: 0.6;
    }
  </style>

<script>

  // Intercept 401s globally, redirect to login
  const _origFetch = window.fetch;
  window.fetch = async function(...args) {
  const res = await _origFetch.apply(this, args);
  if (args[0] && typeof args[0] === 'string' && args[0].includes('/api/')) {
    if (res.status === 401) {
      localStorage.clear();
      sessionStorage.setItem('flock_expired', '1');
      window.location.replace('/login.html');
      return new Promise(() => {}); // halt callers, page is navigating away
    } else if (res.status === 402) {
      sessionStorage.setItem('flock_sub_expired', '1');
      window.location.replace('/subscribe.html');
      return new Promise(() => {});
    }
  }
  return res;
};
</script>

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x35i62ofe4");
</script>
<script>(function(){try{var t=localStorage.getItem("flock_theme");if(t==="dark"||t==="light"||t==="system"){document.documentElement.setAttribute("data-theme",t)}else{document.documentElement.setAttribute("data-theme","system")}}catch(e){}})();</script>
</head>
<body>
<div data-theme-switch="fixed"></div>
  <main class="container" style="max-width: 560px; padding-top: 64px;">
    <h1 class="logo" style="font-size: 48px; text-align: center; margin-bottom: 8px;">fl<span class="accent">o</span>ck</h1>

    <div class="card">
      <h2 class="heading">Set up your venue</h2>
      <p class="subheading">A few details and you're ready to start taking guests.</p>

      <div class="input-group">
        <label for="floorManagerName">Your name (or floor manager's name)</label>
        <input type="text" id="floorManagerName" placeholder="e.g. Rushali" />
      </div>

      <div class="input-group">
        <label for="venueName">Venue name</label>
        <input type="text" id="venueName" placeholder="e.g. The Craftery" />
      </div>

      <div class="input-group">
        <label for="venueAddress">Venue address</label>
        <textarea id="venueAddress" rows="2" placeholder="e.g. 80 Feet Road, Koramangala, Bangalore"></textarea>
      </div>

      <div class="input-group">
        <label for="menuPdf">Menu PDF (optional)</label>
        <input type="file" id="menuPdf" accept="application/pdf" />
      </div>

      <div class="input-group">
        <label for="googleReviewsUrl">Google reviews link (optional)</label>
        <input type="url" id="googleReviewsUrl" placeholder="https://g.page/..." />
      </div>

      <div class="input-group">
        <label>Seating options</label>
        <div class="seating-chips" id="seatingChips"></div>
      </div>

      <button class="button" onclick="createVenue()">Create venue</button>
      <p class="error" id="setupError"></p>
    </div>
  </main>

  <div id="promptModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center;padding:20px;">
    <div style="background:var(--card);border-radius:16px;padding:28px;max-width:360px;width:100%;border:1px solid var(--border-strong);">
      <h3 class="heading" id="promptTitle" style="font-size:18px;margin-bottom:16px;"></h3>
      <input type="text" id="promptInput" style="width:100%;background:var(--card-hover);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-family:inherit;font-size:14px;margin-bottom:16px;box-sizing:border-box;" />
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="window._promptCancel()" style="background:transparent;color:var(--text);border:1px solid var(--border-strong);font-family:inherit;font-size:14px;padding:10px 20px;border-radius:8px;cursor:pointer;">Cancel</button>
        <button onclick="window._promptOk()" style="background:var(--accent);color:var(--accent-text);border:none;font-family:inherit;font-size:14px;font-weight:500;padding:10px 20px;border-radius:8px;cursor:pointer;">Add</button>
      </div>
    </div>
  </div>

  <script>
    if (!localStorage.getItem('flock_token')) {
      window.location.href = '/login.html';
    }

    let seatingOptions = [
      { name: 'Indoor', selected: true },
      { name: 'Outdoor', selected: true },
      { name: 'No preference', selected: true },
    ];

    function renderChips() {
      const protectedOpts = ['Indoor', 'Outdoor', 'No preference'];
      const container = document.getElementById('seatingChips');
      container.innerHTML = seatingOptions.map((opt, i) => `
        <button class="chip ${opt.selected ? 'selected' : ''}" onclick="toggleChip(${i})">
          ${escapeHtml(opt.name)}
          ${!protectedOpts.includes(opt.name) ? `<span class="chip-remove" onclick="removeChip(${i}); event.stopPropagation();">×</span>` : ''}
        </button>
      `).join('') + `
        <button class="chip add-chip" onclick="addChip()">+ Add option</button>
      `;
    }

    function toggleChip(i) {
      seatingOptions[i].selected = !seatingOptions[i].selected;
      renderChips();
    }

    function removeChip(i) {
      seatingOptions.splice(i, 1);
      renderChips();
    }

    function promptModal(title, placeholder) {
      return new Promise((resolve) => {
        const modal = document.getElementById('promptModal');
        document.getElementById('promptTitle').textContent = title;
        const input = document.getElementById('promptInput');
        input.value = '';
        input.placeholder = placeholder || '';
        modal.style.display = 'flex';
        setTimeout(() => input.focus(), 50);
        window._promptOk = () => { modal.style.display = 'none'; resolve(input.value.trim()); };
        window._promptCancel = () => { modal.style.display = 'none'; resolve(null); };
        input.onkeydown = (e) => { if (e.key === 'Enter') window._promptOk(); if (e.key === 'Escape') window._promptCancel(); };
      });
    }

    async function addChip() {
      const name = await promptModal('Add seating option', 'e.g. Bar, Rooftop');
      if (name) {
        seatingOptions.push({ name, selected: true });
        renderChips();
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    renderChips();

    async function createVenue() {
      const errorEl = document.getElementById('setupError');
      const btn = document.querySelector('.button');
      errorEl.textContent = '';

      const payload = {
        floorManagerName: document.getElementById('floorManagerName').value.trim(),
        name: document.getElementById('venueName').value.trim(),
        address: document.getElementById('venueAddress').value.trim(),
        googleReviewsUrl: document.getElementById('googleReviewsUrl').value.trim() || null,
        seatingOptions: seatingOptions.filter(o => o.selected).map(o => o.name).join(',') || 'Indoor,Outdoor,No preference',
        theme: 'dark-premium',
      };
      if (!payload.floorManagerName || !payload.name || !payload.address) {
        errorEl.textContent = 'Please fill in name, venue name, and address.';
        return;
      }
      
      // Optimistic: disable button + show loading state
      btn.disabled = true;
      btn.textContent = 'Creating…';
      
      try {
        const res = await fetch('/api/venues', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('flock_token'),
          },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create venue');
        
        localStorage.setItem('flock_venue', JSON.stringify(data.venue));
        
        // Navigate immediately, menu PDF upload happens in background
        const fileInput = document.getElementById('menuPdf');
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          if (file.size > 20 * 1024 * 1024) {
            errorEl.textContent = 'Menu file too large (max 20 MB). Venue created, but menu was not uploaded.';
          } else if (file.type !== 'application/pdf') {
            errorEl.textContent = 'Menu must be a PDF. Venue created, but menu was not uploaded.';
          } else {
            const formData = new FormData();
            formData.append('menu', file);
            formData.append('name', 'Main menu');
            fetch('/api/venues/' + data.venue.id + '/menus', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + localStorage.getItem('flock_token') },
              body: formData,
            });
          }
        }
        
        window.location.replace('/main.html');
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Create venue';
      }
    }
    
  </script>
<script src="/theme.js"></script>
</body>
</html>
