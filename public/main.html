<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flock — main</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
body { margin: 0; }
.app {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 240px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  transition: width 0.2s;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
.sidebar.collapsed { width: 64px; }
.sidebar-logo {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 28px;
  color: var(--text);
  padding: 0 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-logo .accent { color: var(--accent); }
.sidebar.collapsed .sidebar-logo span:first-child { display: none; }
.sidebar-toggle {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
}
.sidebar-toggle:hover { color: var(--accent); }
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}
.sidebar-item {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  white-space: nowrap;
  overflow: hidden;
}
.sidebar-item:hover { background: var(--card-hover); color: var(--text); }
.sidebar-item.active { background: var(--accent-soft); color: var(--accent); }
.sidebar-item-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.sidebar.collapsed .sidebar-item-label { display: none; }
.sidebar-footer { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }

.main-content {
  flex: 1;
  min-width: 0;
}
.main-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
  flex-wrap: wrap;
}
.main-topbar-left { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.go-live-btn {
  background: var(--accent);
  color: var(--accent-text);
  text-decoration: none;
  padding: 10px 22px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14px;
  font-family: inherit;
}
.go-live-btn:hover { opacity: 0.9; color: var(--accent-text); }

.main-tab-content { padding: 24px; max-width: 1100px; }

.range-btn {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border-strong);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.05em;
}
.range-btn:hover { color: var(--text); border-color: var(--accent); }
.range-btn.active {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
}

.venue-button {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border-strong);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}
.venue-button:hover { border-color: var(--accent); }
#venueDropdown { position: relative; }
.venue-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  overflow: hidden;
  z-index: 100;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  min-width: 220px;
}
.venue-menu-item {
  padding: 12px 16px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.venue-menu-item:hover { background: var(--card-hover); }
.venue-menu-item.add {
  border-top: 1px solid var(--border);
  color: var(--accent);
  font-weight: 500;
}
.venue-delete { opacity: 0.5; font-size: 16px; padding: 4px 6px; cursor: pointer; }
.venue-delete:hover { opacity: 1; color: var(--error); }

@media (max-width: 768px) {
  .sidebar { width: 64px; }
  .sidebar-item-label, .sidebar-logo span:first-child { display: none; }
  .main-tab-content { padding: 16px; }
}

.settings-subnav {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin: 16px 0 20px;
}
.settings-subnav-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  letter-spacing: 0.02em;
}
.settings-subnav-btn:hover { color: var(--text); }
.settings-subnav-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.theme-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s;
}
.theme-card:hover { border-color: var(--accent); }
.theme-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
.theme-preview {
  padding: 16px;
  min-height: 160px;
}
.theme-preview-frame {
  border-radius: 10px;
  padding: 14px;
  font-size: 11px;
  height: 140px;
}
.theme-mock-logo {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 18px;
  margin-bottom: 10px;
}
.theme-mock-card {
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.theme-mock-name { font-weight: 500; font-size: 11px; }
.theme-mock-wait {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 16px;
}
.theme-mock-btn {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 500;
}
.theme-card-meta {
  border-top: 1px solid var(--border);
  padding: 14px 16px;
}
.theme-card-name { font-weight: 500; font-size: 14px; margin-bottom: 2px; }
.theme-card-desc { color: var(--text-muted); font-size: 12px; }
.theme-card-current { color: var(--accent); font-size: 12px; font-weight: 500; margin-top: 8px; }

.theme-preview.theme-midnight-indigo .theme-preview-frame { background: #0a0f3d; color: #ebe2c9; }

.theme-preview.theme-bombay-blue .theme-preview-frame { background: #063540; color: #ead8a8; }
.theme-preview.theme-bombay-blue .theme-accent { color: #c89548; }

.theme-preview.theme-bombay-blue .theme-mock-wait { color: #c89548; }

.theme-preview.theme-spice-market .theme-accent { color: #a02a14; }

.theme-preview.theme-spice-market .theme-mock-btn { background: #a02a14; color: #f7e0c4; }

.theme-preview.theme-charcoal-linen .theme-preview-frame { background: #f3eee5; color: #1a1a1f; }
.theme-preview.theme-charcoal-linen .theme-accent { color: #2a3a5a; }
.theme-preview.theme-charcoal-linen .theme-mock-card { background: #ffffff; border: 1px solid #ddd5c6; }
.theme-preview.theme-charcoal-linen .theme-mock-wait { color: #2a3a5a; }
.theme-preview.theme-charcoal-linen .theme-mock-btn { background: #2a3a5a; color: #f3eee5; }

.theme-preview.theme-brick-birch .theme-preview-frame { background: #fff4d6; color: #3a1206; }
.theme-preview.theme-brick-birch .theme-accent { color: #8c2a14; }

.theme-preview.theme-cloud-mint .theme-preview-frame { background: #eaf4ea; color: #1a3d2a; }
.theme-preview.theme-cloud-mint .theme-accent { color: #d4577e; }
.theme-preview.theme-cloud-mint .theme-mock-card { background: #ffffff; border: 1px solid #c8e0c8; }

.onboarding {
  background: var(--card);
  border: 1px solid var(--accent);
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 20px;
  position: relative;
}
.onboarding-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.onboarding-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 20px;
  color: var(--accent);
}
.onboarding-progress { font-size: 12px; color: var(--text-muted); }
.onboarding-dismiss {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
}
.onboarding-step {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--border);
  font-size: 14px;
}
.onboarding-step:first-of-type { border-top: none; }
.step-check {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 1.5px solid var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 11px;
}
.step-check.done {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
}
.step-action {
  margin-left: auto;
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  font-weight: 500;
}
.step-action:hover { opacity: 0.8; }
  
</style>

<script>
  (function() {
    try {
      const v = JSON.parse(localStorage.getItem('flock_venue') || 'null');
      const t = (v && v.theme) ? v.theme : 'dark-premium';
      document.addEventListener('DOMContentLoaded', function() {
        document.body.className = 'theme-' + t;
      });
    } catch(e) {}
  })();
</script>
  
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span>fl<span class="accent">o</span>ck</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-item active" data-section="analytics" onclick="showSection('analytics')">
        <span class="sidebar-item-icon">📊</span>
        <span class="sidebar-item-label">Analytics</span>
      </button>
      <button class="sidebar-item" data-section="settings" onclick="showSection('settings')">
        <span class="sidebar-item-icon">⚙️</span>
        <span class="sidebar-item-label">Settings</span>
      </button>
      <button class="sidebar-item" data-section="subscription" onclick="showSection('subscription')">
        <span class="sidebar-item-icon">💳</span>
        <span class="sidebar-item-label">Subscription</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-item" onclick="logout()">
        <span class="sidebar-item-icon">↩</span>
        <span class="sidebar-item-label">Log out</span>
      </button>
    </div>
  </aside>

  <div class="main-content">
    <div class="main-topbar">
      <div class="main-topbar-left">
        <div id="venueDropdown">
          <button id="venueButton" class="venue-button" onclick="toggleDropdown(event)">
            <span id="venueButtonLabel"></span>
            <span style="font-size:10px;opacity:0.5;">▼</span>
          </button>
          <div id="venueMenu" class="venue-menu" style="display:none;"></div>

        <div id="subStatus" style="font-size:11px;color:var(--text-muted);letter-spacing:0.05em;text-transform:uppercase;"></div>

        <h2 class="heading" style="margin:0;font-size:24px;">Analytics</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap;" id="rangeToggle">
          <button class="range-btn" data-range="LM" title="Last month" onclick="setRange('LM')">LM</button>
          <button class="range-btn active" data-range="L7D" title="Last 7 days" onclick="setRange('L7D')">L7D</button>

          <canvas id="dailyChart" style="min-width:600px;height:280px;"></canvas>

      <div class="card">
        <h2 class="heading">Busiest hours</h2>
        <p class="subheading">Average guest parties per hour, by day of week</p>

    <div class="main-tab-content" id="subscriptionSection" style="display:none;">
      <h2 class="heading" style="font-size:24px;">Subscription</h2>
      <div id="subscriptionContent"></div>
    </div>
  </div>

<script>
const token = localStorage.getItem('flock_token');
let venue = JSON.parse(localStorage.getItem('flock_venue') || 'null');
if (!token) window.location.href = '/login.html';

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function showSection(s) {
  ['analytics','settings','subscription'].forEach(name => {
    document.getElementById(name + 'Section').style.display = (name === s) ? 'block' : 'none';
    const btn = document.querySelector('[data-section="' + name + '"]');
    if (btn) btn.classList.toggle('active', name === s);
  });
  if (s === 'analytics') loadAnalytics();
  if (s === 'settings') loadSettings();
  if (s === 'subscription') loadSubscription();
}

async function loadVenue() {
  const res = await fetch('/api/venues', {
    headers: { 'Authorization': 'Bearer ' + token },
  });
  const data = await res.json();
  if (!data.venues || data.venues.length === 0) {
    window.location.href = '/setup.html';
    return;
  }
  const savedId = venue ? venue.id : null;
  venue = data.venues.find(v => v.id === savedId) || data.venues[0];
  localStorage.setItem('flock_venue', JSON.stringify(venue));
  document.body.className = 'theme-' + (venue.theme || 'dark-premium');
  document.getElementById('venueButtonLabel').textContent = venue.name;

  const menu = document.getElementById('venueMenu');
  menu.innerHTML = data.venues.map(v =>
    '<div class="venue-menu-item" onclick="selectVenue(\'' + v.id + '\')">' +
    '<span>' + escapeHtml(v.name) + '</span>' +
    '<span class="venue-delete" onclick="deleteVenue(\'' + v.id + '\', \'' + escapeHtml(v.name) + '\'); event.stopPropagation();">🗑</span>' +
    '</div>'
  ).join('') + '<div class="venue-menu-item add" onclick="window.location.href=\'/setup.html\'">+ Add new venue</div>';
}

function toggleDropdown(e) {
  if (e) e.stopPropagation();
  const m = document.getElementById('venueMenu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
}

async function selectVenue(id) {
  // Optimistic: update label instantly from existing venue list in localStorage
  document.getElementById('venueMenu').style.display = 'none';
  
  // Fetch fresh data
  const res = await fetch('/api/venues', {
    headers: { 'Authorization': 'Bearer ' + token },
  });
  const data = await res.json();
  venue = data.venues.find(v => v.id === id);
  if (venue) {
    localStorage.setItem('flock_venue', JSON.stringify(venue));
    document.getElementById('venueButtonLabel').textContent = venue.name;
    document.body.className = 'theme-' + (venue.theme || 'dark-premium');
    loadQueue();
  }
}

async function deleteVenue(id, name) {
  if (!confirm('Delete "' + name + '"? This cannot be undone.')) return;
  const res = await fetch('/api/venues/' + id, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + token },
  });
  if (res.ok) {
    if (venue && venue.id === id) {
      localStorage.removeItem('flock_venue');
      venue = null;
    }
    loadVenue().then(() => loadAnalytics());
  }
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadSubStatus() {
  const res = await fetch('/api/subscription/status', {
    headers: { 'Authorization': 'Bearer ' + token },
  });
  const data = await res.json();
  const el = document.getElementById('subStatus');
  const billing = data.venueQuantity > 0 ? ' · ₹' + data.monthlyAmount + '/mo (' + data.venueQuantity + ' venue' + (data.venueQuantity !== 1 ? 's' : '') + ')' : '';
  if (data.status === 'trial' && data.trialEndsAt) {
    const daysLeft = Math.floor((new Date(data.trialEndsAt) - new Date()) / (1000 * 60 * 60 * 24));
    el.innerHTML = '<span style="color:var(--accent);">Trial · ' + daysLeft + ' day' + (daysLeft !== 1 ? 's' : '') + ' left' + billing + '</span>';
  } else if (data.status === 'active') {

  } else if (data.status === 'expired') {
    el.innerHTML = '<span style="color:var(--error);">Subscription expired</span>';
  } else if (data.status === 'cancelled') {
    el.innerHTML = '<span style="color:var(--error);">Cancelled</span>';
  }
}

let dailyChart=null, hoursChart=null, partyChart=null, analyticsData=null;
let selectedDows = new Set(['all','0','1','2','3','4','5','6']);
let currentRange = 'L7D';
const RANGE_LABELS = { LM:'Last month', L7D:'Past 7 days', MTD:'Month to date', L3M:'Last 3 months', L6M:'Last 6 months', YTD:'Year to date', L1Y:'Last 1 year' };
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function setRange(r) {
  currentRange = r;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === r));
  loadAnalytics();

function toggleDow(dow) {
  if (dow === 'all') {
    if (selectedDows.has('all')) selectedDows = new Set();
    else selectedDows = new Set(['all','0','1','2','3','4','5','6']);
  } else {
    if (selectedDows.has(dow)) { selectedDows.delete(dow); selectedDows.delete('all'); }
    else {
      selectedDows.add(dow);
      if (['0','1','2','3','4','5','6'].every(d => selectedDows.has(d))) selectedDows.add('all');
    }
  }
  document.querySelectorAll('#dowFilterChips .chip').forEach(b => b.classList.toggle('selected', selectedDows.has(b.dataset.dow)));
  if (analyticsData) renderHoursChart();
}

function getThemeColors() {
  const style = getComputedStyle(document.body);
  return {
    accent: style.getPropertyValue('--accent').trim() || '#f5a854',
    text: style.getPropertyValue('--text').trim() || '#f5ead4',
    textMuted: style.getPropertyValue('--text-muted').trim() || 'rgba(245,234,212,0.5)',
    border: style.getPropertyValue('--border').trim() || 'rgba(245,234,212,0.08)',
  };
}

function hexToRgba(hex, alpha) {
  // Accepts #rgb, #rrggbb, or rgba(...) — returns rgba string
  if (hex.startsWith('rgba')) return hex;
  if (hex.startsWith('rgb(')) return hex.replace('rgb(', 'rgba(').replace(')', ',' + alpha + ')');
  let h = hex.replace('#','');
  if (h.length === 3) h = h.split('').map(c => c+c).join('');
  const r = parseInt(h.slice(0,2),16);
  const g = parseInt(h.slice(2,4),16);
  const b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

async function loadAnalytics() {
  if (!venue) return;
  const res = await fetch('/api/queue/analytics/' + venue.id + '?range=' + currentRange, {
    headers: { 'Authorization': 'Bearer ' + token },
  });
  analyticsData = await res.json();
  document.getElementById('dailyChartSub').textContent = RANGE_LABELS[currentRange];

        datasets:[{label:'Guest parties', data: analyticsData.daily.map(d => d.count), backgroundColor: colors.accent, borderRadius:4}]
      },
      options: chartBaseOptions({noLegend:true})
    });
  } else {
    dailyChart = buildClusterChart(dailyCtx, analyticsData.daily, 'count', 'Guest parties');
  }
  renderHoursChart();

        datasets:[{label:'Avg party size', data: analyticsData.daily.map(d => d.avgPartySize), backgroundColor: colors.accent, borderRadius:4}]
      },
      options: chartBaseOptions({noLegend:true})
    });
  } else {
    partyChart = buildClusterChart(partyCtx, analyticsData.daily, 'avgPartySize', 'Avg party size');
  }
}

function buildClusterChart(ctx, daily, valueKey, datasetLabel) {
  const colors = getThemeColors();
  const labels = [], values = [], clusterMidpoints = [], dowAverages = [];
  const orderedDays = [1,2,3,4,5,6,0];
  orderedDays.forEach((dow, dowIdx) => {
    const daysForDow = daily.filter(d => d.dayOfWeek === dow && d[valueKey] > 0);
    const clusterStartIdx = labels.length;
    const midIdx = clusterStartIdx + Math.floor(daysForDow.length / 2);
    if (daysForDow.length === 0) {
      labels.push(DAY_NAMES[dow]); values.push(0);
      clusterMidpoints.push(clusterStartIdx); dowAverages.push(null);
    } else {
      daysForDow.forEach((d, idx) => {
        labels.push((clusterStartIdx + idx) === midIdx ? DAY_NAMES[dow] : '');
        values.push(d[valueKey]);
      });
      const avg = daysForDow.reduce((s, d) => s + d[valueKey], 0) / daysForDow.length;
      clusterMidpoints.push(midIdx); dowAverages.push(avg);
    }
    if (dowIdx < orderedDays.length - 1) { labels.push(''); values.push(null); }
  });
  const lineData = labels.map((_, i) => {
    const c = clusterMidpoints.indexOf(i);
    return c === -1 ? null : dowAverages[c];
  });
  return new Chart(ctx, {
    type:'bar',
    data: { labels, datasets:[
      { type:'bar', label: datasetLabel, data: values, backgroundColor: colors.accent, borderRadius: 3 },
      { type:'line', label:'Day-of-week avg', data: lineData, borderColor: hexToRgba(colors.accent, 0.45), backgroundColor:'transparent', borderWidth:2, pointRadius: 3, pointBackgroundColor: hexToRgba(colors.accent, 0.7), spanGaps:true, tension:0.3 }
    ]},
    options: chartBaseOptions(),
  });
}

function renderHoursChart() {
  if (!analyticsData) return;
  const colors = getThemeColors();
  const hoursCtx = document.getElementById('hoursChart').getContext('2d');
  if (hoursChart) hoursChart.destroy();
  const dows = ['0','1','2','3','4','5','6'].filter(d => selectedDows.has(d)).map(d => parseInt(d));
  const result = Array(24).fill(0);
  if (dows.length > 0) {
    const totalDays = dows.reduce((s, d) => s + (analyticsData.dowDayCounts[d] || 0), 0);
    if (totalDays > 0) {
      for (let h = 0; h < 24; h++) {
        let totalParties = 0;
        dows.forEach(d => { totalParties += (analyticsData.hoursByDow[d]?.[h] || 0); });
        result[h] = totalParties / totalDays;
      }
    }
  }
  hoursChart = new Chart(hoursCtx, {
    type:'bar',
    data: { labels: result.map((_, i) => i + ':00'), datasets:[{ label:'Avg guest parties', data: result.map(v => parseFloat(v.toFixed(2))), backgroundColor: colors.accent, borderRadius:3 }]},
    options: chartBaseOptions({noLegend:true}),
  });
}

function chartBaseOptions(opts={}) {
  const colors = getThemeColors();
  return {
    responsive:true, maintainAspectRatio:false,
    plugins: { legend: { display: !opts.noLegend, position:'bottom', labels:{color: colors.textMuted, font:{size:10}, boxWidth:12, padding:12 } } },
    scales: {
      y: { beginAtZero:true, ticks:{color: colors.textMuted, font:{size:10}}, grid:{color: colors.border}, border:{display:false} },
      x: { ticks:{color: colors.textMuted, font:{size:10}, autoSkip:false}, grid:{display:false}, border:{color: colors.border} },
    },
  };
}

  const c = document.getElementById('settingsChips');

    <button class="chip ${opt.selected ? 'selected' : ''}" onclick="toggleSettingsChip(${i})">
      ${escapeHtml(opt.name)}
      ${!protectedOpts.includes(opt.name) ? `<span class="chip-remove" onclick="removeSettingsChip(${i}); event.stopPropagation();">×</span>` : ''}
    </button>
  `).join('') + '<button class="chip add-chip" onclick="addSettingsChip()">+ Add option</button>';
}

function toggleSettingsChip(i) {
  settingsSeating[i].selected = !settingsSeating[i].selected;
  renderSettingsChips();
}
function removeSettingsChip(i) {
  settingsSeating.splice(i, 1);
  renderSettingsChips();
}
function addSettingsChip() {
  const name = prompt('New seating option:');
  if (name && name.trim()) {
    settingsSeating.push({ name: name.trim(), selected: true });
    renderSettingsChips();
  }
}

async function saveSettings() {
  const errEl = document.getElementById('settingsError');
  const okEl = document.getElementById('settingsSuccess');
  errEl.textContent = '';
  okEl.textContent = '';
  const payload = {
    name: document.getElementById('settingsName').value.trim(),
    address: document.getElementById('settingsAddress').value.trim(),
    floorManagerName: document.getElementById('settingsManager').value.trim(),
    googleReviewsUrl: document.getElementById('settingsReviews').value.trim() || null,
    seatingOptions: settingsSeating.filter(o => o.selected).map(o => o.name).join(',') || 'Indoor,Outdoor,No preference',
    waitTimeBase: parseInt(document.getElementById('settingsBase').value) || 8,
    waitTimeIncrement: parseInt(document.getElementById('settingsIncrement').value) || 3,
    waitTimeCap: parseInt(document.getElementById('settingsCap').value) || 60,
  };

  // Optimistic: show "Saved" immediately
  okEl.textContent = 'Saved.';
  // Update local venue copy
  Object.assign(venue, payload);
  localStorage.setItem('flock_venue', JSON.stringify(venue));
  
  try {
    const res = await fetch('/api/venues/' + venue.id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save');
    venue = data.venue;
    const fileInput = document.getElementById('settingsMenuFile');
    if (fileInput.files.length > 0) {
      const formData = new FormData();
      formData.append('menu', fileInput.files[0]);
      const uploadRes = await fetch('/api/venues/' + venue.id + '/menu', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData,
      });
      const uploadData = await uploadRes.json();
      if (uploadRes.ok) venue = uploadData.venue;
    }
    localStorage.setItem('flock_venue', JSON.stringify(venue));
    okEl.textContent = 'Saved.';
    loadVenue();
    loadSettings();
  } catch (err) {
    errEl.textContent = err.message;
  }
}

async function cancelSubscription() {
  if (!confirm('Cancel your flock subscription? You\'ll keep access until the end of the current billing cycle.')) return;
  
  // Optimistic: show cancelled state immediately
  const content = document.getElementById('subscriptionContent');
  const status = content.querySelector('div[style*="color:var(--success)"], div[style*="color:var(--accent)"]');
  if (status) {
    status.outerHTML = '<div style="color:var(--error);">Cancelled · access continues until cycle end</div>';
  }
  
  // Fire backend
  fetch('/api/subscription/cancel', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
  }).then(res => {
    if (res.ok) {
      loadSubscription();
      loadSubStatus();
    } else {
      alert('Failed to cancel. Please email us at rushali.c1710@gmail.com.');
      loadSubscription();
    }
  });
}

function downloadQr() {
  if (!venue) return;
  const url = window.location.origin + '/queue.html?venue=' + venue.slug;
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=800x800&data=' + encodeURIComponent(url);
  const a = document.createElement('a');
  a.href = qrUrl;
  a.download = 'flock-qr-' + venue.slug + '.png';
  a.target = '_blank';
  a.click();
}  

async function renderOnboarding() {
  if (!venue) return;
  const box = document.getElementById('onboardingBox');
  if (venue.onboardingDismissed) {
    box.innerHTML = '';
    return;
  }
  const hasRes = await fetch('/api/queue/has-any/' + venue.id, {
    headers: { 'Authorization': 'Bearer ' + token },
  });
  const hasData = await hasRes.json();
  const hasFirstGuest = !!hasData.hasAny;
  const steps = [
    { label: 'Create your venue', done: true, action: null },
    { label: 'Upload your menu', done: !!venue.menuPdfUrl, action: 'settings' },
    { label: 'Add your Google reviews link', done: !!venue.googleReviewsUrl, action: 'settings' },
    { label: 'Print and place your QR code', done: !!venue.qrMarkedPlaced, action: 'qr' },
    { label: 'Add your first guest', done: hasFirstGuest, action: null },
  ];
  const doneCount = steps.filter(s => s.done).length;
  const total = steps.length;
  if (doneCount === total || venue.onboardingDismissed) {
    box.innerHTML = '';
    if (onboardingInterval) { clearInterval(onboardingInterval); onboardingInterval = null; }
    return;
  }
  box.innerHTML = `
    <div class="onboarding">
      <div class="onboarding-header">
        <div>
          <div class="onboarding-title">Get set up</div>
          <div class="onboarding-progress">${doneCount} of ${total} complete</div>
        </div>
        <button class="onboarding-dismiss" onclick="dismissOnboarding()" title="Hide">×</button>
      </div>
      ${steps.map(s => `
        <div class="onboarding-step">
          <div class="step-check ${s.done ? 'done' : ''}">${s.done ? '✓' : ''}</div>
          <div>${s.label}</div>
          ${!s.done && s.action === 'settings' ? '<a class="step-action" onclick="showSection(\'settings\'); showSettingsSub(\'venue\');">Open settings →</a>' : ''}
          ${!s.done && s.action === 'qr' ? '<a class="step-action" onclick="markQrPlaced()">Mark as placed</a>' : ''}
        </div>
      `).join('')}
    </div>
  `;
}

async function markQrPlaced() {
  await fetch('/api/venues/' + venue.id + '/qr-placed', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
  });
  venue.qrMarkedPlaced = true;
  localStorage.setItem('flock_venue', JSON.stringify(venue));
  renderOnboarding();
}

async function dismissOnboarding() {
  if (!confirm('Hide the setup checklist? You can\'t bring it back.')) return;
  await fetch('/api/venues/' + venue.id + '/dismiss-onboarding', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
  });
  venue.onboardingDismissed = true;
  localStorage.setItem('flock_venue', JSON.stringify(venue));
  renderOnboarding();
}  
  
loadVenue().then(() => {
  loadAnalytics();
  loadSubStatus();
  renderOnboarding();
});

let onboardingInterval = setInterval(renderOnboarding, 10000);

setInterval(() => fetch('/health'), 5 * 60 * 1000);
</script>
</body>
</html>
