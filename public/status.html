<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your queue status · flock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=optional">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=optional">
<link rel="stylesheet" href="/styles.css">
<style>
.status-card { text-align: center; padding: 48px 24px; }
.position { font-family: 'Fraunces', serif; font-style: italic; font-size: 96px; color: var(--accent); line-height: 1; margin-bottom: 8px; }
.position-label { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }
.wait { font-family: 'Fraunces', serif; font-size: 28px; margin-bottom: 8px; }
.wait-label { font-size: 13px; color: var(--text-muted); }
.leave-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; width: 100%; margin-top: 24px; }
.leave-btn:hover { border-color: var(--error); color: var(--error); }
.action-card { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: var(--text); }
.action-card:hover { border-color: var(--accent); }
.action-card h4 { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
.action-card p { font-size: 13px; color: var(--text-muted); }
.action-card-arrow { color: var(--accent); font-size: 20px; }
.action-card-body {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
}
.action-card-icon {
  width: 22px;
  height: 22px;
  color: var(--accent);
  flex-shrink: 0;
}
.notified-banner { background: var(--accent); color: var(--accent-text); padding: 16px; border-radius: 12px; text-align: center; font-weight: 500; margin-bottom: 24px; }
</style>

<style>body{opacity:0;}body.theme-loaded{opacity:1;transition:opacity 0.15s;}</style>
<script>
  (function() {
    try {
      const v = JSON.parse(sessionStorage.getItem('flock_venue_data') || 'null');
      const t = v && v.theme ? v.theme : null;
      document.addEventListener('DOMContentLoaded', function() {
        if (t) {
          document.body.className = 'theme-' + t + ' theme-loaded';
        }
      });
      setTimeout(function() {
        if (!document.body.classList.contains('theme-loaded')) {
          document.body.className = 'theme-dark-premium theme-loaded';
        }
      }, 4000);
    } catch(e) {}
  })();
</script>

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x35i62ofe4");
</script>
  
</head>
<body>
<main class="container" style="max-width: 480px; padding-top: 32px;">
  <h1 class="logo" style="font-size: 48px; text-align: center; margin-bottom: 8px;">fl<span class="accent">o</span>ck</h1>
  <p style="text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:32px;" id="venueLabel"></p>

  <div id="notifiedBanner" class="notified-banner" style="display:none;">Your table is ready. Please head in!</div>

  <div class="card status-card">
    <div class="position" id="position">·</div>
    <div class="position-label" id="positionLabel">in queue</div>
    <div class="wait" id="wait">~ minutes</div>
    <div class="wait-label" id="waitLabel">approximate wait</div>
    <button class="leave-btn" id="leaveBtn" onclick="cancelEntry()">Leave waitlist</button>
  </div>

  <div id="menuCardsContainer"></div>

  <a href="#" class="card action-card" id="reviewCard" style="display:none;" target="_blank">
    <div class="action-card-body">
      <svg class="action-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      <div>
        <h4>Review us on Google</h4>
        <p>Tell others about your experience</p>
      </div>
    </div>
    <span class="action-card-arrow">→</span>
  </a>
</main>

<div id="leaveModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--card);border-radius:16px;padding:28px;max-width:360px;width:100%;border:1px solid var(--border-strong);text-align:center;">
    <h3 class="heading" style="font-size:20px;margin-bottom:8px;">Leave the waitlist?</h3>
    <p class="subheading" style="margin-bottom:20px;">You'll lose your spot. You can always rejoin later.</p>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button onclick="_cancelLeave()" style="background:transparent;color:var(--text);border:1px solid var(--border-strong);font-family:inherit;font-size:14px;padding:10px 20px;border-radius:8px;cursor:pointer;flex:1;">Stay</button>
      <button onclick="_confirmLeave()" style="background:var(--error,#ef4444);color:#fff;border:none;font-family:inherit;font-size:14px;font-weight:500;padding:10px 20px;border-radius:8px;cursor:pointer;flex:1;">Leave</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const entryId = params.get('id');
let venue = null;
let lastMenuKey = null;
let reviewRendered = false;

// Pre-fill from URL params (instant render before first API call)
const preposition = params.get('position');
const prewait = params.get('wait');
const prevenue = params.get('venueName');
if (preposition && prewait) {
  document.getElementById('position').textContent = '#' + preposition;
  document.getElementById('positionLabel').textContent = preposition === '1' ? 'next up' : 'in queue';
  document.getElementById('wait').textContent = '~' + prewait + ' minutes';
}
if (prevenue) {
  document.getElementById('venueLabel').textContent = prevenue;
}
// Pre-render menus + review card from sessionStorage cache (set by queue.html)
function escapeHtmlEarly(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
try {
  const cachedVenue = JSON.parse(sessionStorage.getItem('flock_venue_data') || 'null');
  if (cachedVenue) {
    const mc = document.getElementById('menuCardsContainer');
    if (cachedVenue.menus && cachedVenue.menus.length > 0) {
      mc.innerHTML = cachedVenue.menus.map(m => `
        <a href="${m.url}" class="card action-card" target="_blank">
          <div class="action-card-body">
            <svg class="action-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            <div>
              <h4>${escapeHtmlEarly(m.name)}</h4>
              <p>Browse while you wait</p>
            </div>
          </div>
          <span class="action-card-arrow">→</span>
        </a>
      `).join('');
      lastMenuKey = cachedVenue.menus.map(m => m.id + ':' + m.name + ':' + m.url).join('|');
    }
    if (cachedVenue.googleReviewsUrl) {
      const rc = document.getElementById('reviewCard');
      rc.style.display = 'flex';
      rc.href = cachedVenue.googleReviewsUrl;
      reviewRendered = true;
    }
  }
} catch(e) {}

function tickStatusWait() {
  const wait = document.getElementById('wait');
  if (!wait || wait.style.display === 'none') return;
  const position = Number(wait.getAttribute('data-position'));
  if (!position || position === 1) return; // pos 1 is static
  const serverWait = Number(wait.getAttribute('data-server-wait'));
  const baseWait = Number(wait.getAttribute('data-base-wait'));
  const lastSync = Number(wait.getAttribute('data-last-sync'));
  if (!serverWait || !lastSync) return;
  const minutesSinceSync = Math.floor((Date.now() - lastSync) / 60000);
  const ticked = Math.max(baseWait, serverWait - minutesSinceSync);
  const display = '~' + ticked + ' minutes';
  if (wait.textContent !== display) wait.textContent = display;
}
setInterval(tickStatusWait, 1000);
  
async function loadStatus() {
  if (!entryId) return;
  if (loadStatusInFlight) return; // #41: a fetch is already in flight, skip the duplicate
  loadStatusInFlight = true;
  try {
    const res = await fetch('/api/queue/status/' + entryId);
    let data = {};
    try { data = await res.json(); } catch (_) { /* #40: non-JSON error body (e.g. gateway error) */ }
    if (!res.ok) {
      const e = new Error(data.error || 'Failed to load status');
      e.status = res.status;
      throw e;
    }
    if (data.entry && data.entry.venue) {
      document.body.className = 'theme-' + (data.entry.venue.theme || 'dark-premium') + ' theme-loaded';
      sessionStorage.setItem('flock_venue_data', JSON.stringify(data.entry.venue));
    }

    venue = data.entry.venue;
    if (venue && venue.id && venue.id !== statusVenueId) {
      statusVenueId = venue.id;
      subscribeVenuePublic(); // we now know the venue id, subscribe for real-time position
    }
    document.getElementById('venueLabel').textContent = venue.name;

    const banner = document.getElementById('notifiedBanner');
    const wait = document.getElementById('wait');
    const waitLabel = document.getElementById('waitLabel');
    const status = data.entry.status;

    if (status === 'notified') {
      banner.style.display = 'block';
      document.getElementById('position').textContent = '\u2713';
      document.getElementById('positionLabel').textContent = 'table ready';
      wait.style.display = 'none';
      waitLabel.style.display = 'none';
      document.getElementById('leaveBtn').style.display = 'none';
    } else if (status === 'seated') {
      document.getElementById('position').textContent = '\u2713';
      document.getElementById('positionLabel').textContent = 'seated · enjoy your meal';
      wait.style.display = 'none';
      waitLabel.style.display = 'none';
      document.getElementById('leaveBtn').style.display = 'none';
      stopStatusUpdates(); // #42: terminal state, stop polling and close the WS
      // Show review prompt prominently if available
      const rc = document.getElementById('reviewCard');
      if (venue.googleReviewsUrl && rc) {
        rc.style.display = 'flex';
        rc.href = venue.googleReviewsUrl;
        rc.querySelector('h4').textContent = 'How was it? Leave a review';
        rc.querySelector('p').textContent = 'A quick rating helps the venue a lot';
      }
    } else if (status === 'cancelled') {
      document.getElementById('position').textContent = '\u2014';
      document.getElementById('positionLabel').textContent = 'cancelled';
      wait.style.display = 'none';
      waitLabel.style.display = 'none';
      document.getElementById('leaveBtn').style.display = 'none';
      stopStatusUpdates(); // #42: terminal state, stop polling and close the WS
    } else {
      banner.style.display = 'none';
      document.getElementById('position').textContent = '#' + data.position;
      document.getElementById('positionLabel').textContent = data.position === 1 ? 'next up' : 'in queue';
      wait.style.display = 'block';
      waitLabel.style.display = 'block';
      wait.textContent = '~' + data.waitMinutes + ' minutes';
      wait.setAttribute('data-position', data.position);
      wait.setAttribute('data-server-wait', data.waitMinutes);
      wait.setAttribute('data-base-wait', venue.waitTimeBase || 8);
      wait.setAttribute('data-last-sync', Date.now());
      document.getElementById('leaveBtn').style.display = 'block';
    }

    // Re-render menus if the list changed (owner may add/remove menus mid-session)
    const menuKey = venue.menus ? venue.menus.map(m => m.id + ':' + m.name + ':' + m.url).join('|') : '';
    if (menuKey !== lastMenuKey) {
      const menuContainer = document.getElementById('menuCardsContainer');
      if (venue.menus && venue.menus.length > 0) {
        menuContainer.innerHTML = venue.menus.map(m => `
          <a href="${m.url}" class="card action-card" target="_blank">
            <div class="action-card-body">
              <svg class="action-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
              <div>
                <h4>${escapeHtml(m.name)}</h4>
                <p>Browse while you wait</p>
              </div>
            </div>
            <span class="action-card-arrow">→</span>
          </a>
        `).join('');
      } else {
        menuContainer.innerHTML = '';
      }
      lastMenuKey = menuKey;
    }

    if (!reviewRendered) {
      const reviewCard = document.getElementById('reviewCard');
      if (venue.googleReviewsUrl) {
        reviewCard.style.display = 'flex';
        reviewCard.href = venue.googleReviewsUrl;
      }
      reviewRendered = true;
    }
  } catch (err) {
    console.error(err);
    if (err.status === 404) {
      stopStatusUpdates();
      document.body.innerHTML = '<div style="text-align:center;padding:60px 24px;color:var(--text-muted);font-size:16px;"><p style="font-size:18px;margin-bottom:12px;">This queue is no longer available.</p><p style="font-size:13px;">Please ask the venue staff for help. <a href="/" style="color:var(--accent);">Back to home</a></p></div>';
    }
  } finally {
    loadStatusInFlight = false;
  }
}

function cancelEntry() {
  document.getElementById('leaveModal').style.display = 'flex';
}
async function _confirmLeave() {
  document.getElementById('leaveModal').style.display = 'none';
  try {
    const res = await fetch('/api/queue/cancel/' + entryId, { method: 'POST' });
    if (res.status === 409) {
      // Already seated or already cancelled, just refresh
      loadStatus();
      return;
    }
  } catch (e) {}
  document.body.innerHTML = '<div style="text-align:center;padding:60px 24px;color:var(--text-muted);font-size:16px;">You\'ve left the waitlist. <a href="/" style="color:var(--accent);">Back to home</a></div>';
}
function _cancelLeave() {
  document.getElementById('leaveModal').style.display = 'none';
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// WebSocket for real-time push; falls back to slow polling when disconnected
let statusWs = null;
let statusWsReconnectTimer = null;
let statusWsBackoff = 1000;
let statusInterval = null;
let statusVenueId = null;
let loadStatusInFlight = false; // #41: dedup overlapping loadStatus calls
let statusDone = false;         // #42: terminal state reached, stop polling/reconnecting

// Subscribe to the venue's PII-free public channel so queue-wide position changes push
// in real time. Safe to call repeatedly, the server dedups, and it no-ops until the WS
// is open and we know the venue id (learned from the first loadStatus).
function subscribeVenuePublic() {
  if (statusVenueId && statusWs && statusWs.readyState === WebSocket.OPEN) {
    statusWs.send(JSON.stringify({ type: 'subscribe', key: 'venue-public:' + statusVenueId }));
  }
}

function setStatusPollRate() {
  if (statusInterval) clearInterval(statusInterval);
  // Poll as a slow fallback, real-time position changes now arrive via the venue-public
  // WS channel, so we no longer need an aggressive 3s poll.
  statusInterval = setInterval(loadStatus, 15000);
}

// #42: tear down all live updates once the guest reaches a terminal state (seated / cancelled /
// queue gone) so the WebSocket doesn't keep reconnecting in the background indefinitely.
function stopStatusUpdates() {
  statusDone = true;
  if (statusInterval) { clearInterval(statusInterval); statusInterval = null; }
  if (statusWsReconnectTimer) { clearTimeout(statusWsReconnectTimer); statusWsReconnectTimer = null; }
  if (statusWs) { try { statusWs.close(); } catch (e) {} statusWs = null; }
}

function connectStatusWs() {
  if (!entryId || statusDone) return;
  if (statusWs && (statusWs.readyState === WebSocket.OPEN || statusWs.readyState === WebSocket.CONNECTING)) return;

  const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  statusWs = new WebSocket(proto + '//' + window.location.host + '/ws');

  statusWs.addEventListener('open', () => {
    statusWsBackoff = 1000;
    statusWs.send(JSON.stringify({ type: 'subscribe', key: 'entry:' + entryId }));
    subscribeVenuePublic(); // (re)subscribe to the venue channel if we already know the id
  });

  statusWs.addEventListener('message', (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'entry_changed' || msg.type === 'queue_changed') {
        // Always refetch, status page needs full venue + computed position/waitMinutes
        // which aren't in the broadcast payload. The push just triggers an immediate refetch
        // instead of waiting for the next poll tick. (entry_changed = self events;
        // queue_changed = someone ahead moved, via the venue-public channel.)
        loadStatus();
      }
    } catch(err) {}
  });

  statusWs.addEventListener('close', () => {
    if (statusDone) return; // #42: don't reconnect after a terminal state
    if (statusWsReconnectTimer) clearTimeout(statusWsReconnectTimer);
    statusWsReconnectTimer = setTimeout(connectStatusWs, statusWsBackoff);
    statusWsBackoff = Math.min(statusWsBackoff * 2, 30000);
  });

  statusWs.addEventListener('error', () => {
    try { statusWs.close(); } catch(err) {}
  });
}

setStatusPollRate();
loadStatus();
connectStatusWs();
</script>
</body>
</html>
